<!doctype html>
<!--
  本机运行对话页：由移动端壳内嵌的本机 Runtime 在 http://127.0.0.1:<port>/ 同源提供。
  功能：Provider 配置（OpenAI 兼容）/ 多会话 / SSE 流式对话。
  刻意不依赖任何前端框架与远程资源：无桌面端、无网络（除 Provider 请求）也必须可用。
  安全：所有用户/助手文本一律走 textContent 渲染；apiKey 提交后不回显。
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <title>Pisper Local</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --surface: #161b22;
        --border: #2d333b;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #4c8dff;
        --danger: #ef6d6d;
        --ok: #4ec98a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        height: 100dvh;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: max(10px, env(safe-area-inset-top)) 12px 10px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        flex: none;
      }
      header .title {
        font-size: 15px;
        font-weight: 600;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      header .provider-tag {
        font-size: 11px;
        color: var(--muted);
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 14px;
        font-weight: 600;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
      }
      button.icon {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 400;
      }
      button:disabled {
        opacity: 0.5;
      }
      .panel {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        flex: none;
      }
      .panel h2 {
        font-size: 14px;
        margin: 0;
      }
      .panel label {
        font-size: 12px;
        color: var(--muted);
        display: block;
        margin-bottom: 4px;
      }
      .panel input {
        width: 100%;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 14px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .row > * {
        flex: 1;
      }
      .row > .fit {
        flex: none;
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.55;
        margin: 0;
      }
      .error {
        color: var(--danger);
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        margin: 0;
      }
      .ok {
        color: var(--ok);
        font-size: 12px;
        margin: 0;
      }
      .provider-row,
      .session-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .provider-row.active {
        border-color: var(--accent);
      }
      .provider-row .name,
      .session-row .name {
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .provider-row .meta,
      .session-row .meta {
        font-size: 11px;
        color: var(--muted);
      }
      .provider-row .ops,
      .session-row .ops {
        display: flex;
        gap: 6px;
        flex: none;
      }
      .ops button {
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 400;
      }
      #chat {
        flex: 1;
        overflow-y: auto;
        padding: 14px 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .msg {
        max-width: 88%;
        padding: 10px 12px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .msg.user {
        align-self: flex-end;
        background: var(--accent);
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .msg.assistant {
        align-self: flex-start;
        background: var(--surface);
        border: 1px solid var(--border);
        border-bottom-left-radius: 4px;
      }
      .msg.system-note {
        align-self: center;
        background: transparent;
        border: 1px dashed var(--border);
        color: var(--muted);
        font-size: 12px;
      }
      .msg.streaming::after {
        content: '▍';
        color: var(--accent);
        animation: blink 1s steps(2) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      #composer {
        flex: none;
        display: flex;
        gap: 8px;
        align-items: flex-end;
        padding: 10px 12px max(12px, env(safe-area-inset-bottom));
        border-top: 1px solid var(--border);
        background: var(--surface);
      }
      #input {
        flex: 1;
        resize: none;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 14px;
        line-height: 1.5;
        max-height: 120px;
        font-family: inherit;
      }
      #send {
        flex: none;
      }
      .hidden {
        display: none !important;
      }
      #empty {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
        padding: 24px;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <header>
      <button class="icon" id="back-btn"></button>
      <div class="title">
        <span id="title"></span>
        <span class="provider-tag" id="provider-tag"></span>
      </div>
      <button class="icon" id="sessions-btn"></button>
      <button class="icon" id="provider-btn"></button>
      <button class="icon" id="new-btn"></button>
    </header>

    <div class="panel hidden" id="provider-panel">
      <h2 id="provider-title"></h2>
      <div id="provider-list"></div>
      <div>
        <label id="label-base"></label>
        <input
          id="input-base"
          inputmode="url"
          autocapitalize="off"
          placeholder="https://api.openai.com/v1"
        />
      </div>
      <div>
        <label id="label-key"></label>
        <input id="input-key" type="password" autocapitalize="off" placeholder="sk-…" />
      </div>
      <div class="row">
        <div>
          <label id="label-model"></label>
          <input
            id="input-model"
            autocapitalize="off"
            placeholder="gpt-4o-mini"
            list="model-options"
          />
          <datalist id="model-options"></datalist>
        </div>
        <div>
          <label id="label-name"></label>
          <input id="input-name" autocapitalize="off" placeholder="OpenAI" />
        </div>
      </div>
      <div class="row">
        <button id="save-provider"></button>
        <button class="secondary fit" id="test-provider"></button>
      </div>
      <p class="hint" id="provider-hint"></p>
      <p class="error" id="provider-error"></p>
      <p class="ok hidden" id="provider-ok"></p>
    </div>

    <div class="panel hidden" id="sessions-panel">
      <h2 id="sessions-title"></h2>
      <div id="session-list"></div>
    </div>

    <div id="chat"></div>
    <div id="empty"></div>

    <div id="composer">
      <textarea id="input" rows="1"></textarea>
      <button id="send"></button>
    </div>

    <script>
      ;(function () {
        'use strict'

        var zh =
          String(navigator.language || '')
            .toLowerCase()
            .indexOf('zh') === 0
        var t = function (zhText, enText) {
          return zh ? zhText : enText
        }

        var strings = {
          title: t('本机运行', 'On-device'),
          back: t('服务器', 'Servers'),
          sessions: t('会话', 'Chats'),
          newChat: t('新会话', 'New'),
          provider: t('Provider', 'Provider'),
          providerTitle: t('模型 Provider（OpenAI 兼容）', 'Model provider (OpenAI-compatible)'),
          baseUrl: t('接口地址（Base URL）', 'Base URL'),
          apiKey: t('API Key（留空表示不修改）', 'API key (leave blank to keep unchanged)'),
          model: t('模型', 'Model'),
          name: t('名称（可选）', 'Name (optional)'),
          save: t('保存并启用', 'Save & activate'),
          test: t('测试连接', 'Test'),
          providerHint: t(
            '密钥只保存在本机，由系统安全存储加密保管。地址须为 https://，仅本机回环地址允许 http://；测试连接成功后可直接从模型列表选择。',
            'Keys are encrypted at rest by the platform secure storage. HTTPS is required (plain HTTP only for loopback). After a successful connection test you can pick a model from the list.',
          ),
          empty: t(
            '这是运行在你手机上的受限 Runtime，不依赖桌面端。\n先配置一个 OpenAI 兼容 Provider，然后开始对话。',
            'This is a constrained runtime running on your phone — no desktop required.\nConfigure an OpenAI-compatible provider to start chatting.',
          ),
          emptyChat: t('输入消息开始对话。', 'Type a message to start.'),
          send: t('发送', 'Send'),
          stop: t('停止', 'Stop'),
          connecting: t('连接中…', 'Connecting…'),
          testOk: function (models) {
            return (
              t('连接成功', 'Connected') +
              (models.length ? t('，可用模型：', ', models: ') + models.slice(0, 8).join(', ') : '')
            )
          },
          noProvider: t('请先配置 Provider。', 'Configure a provider first.'),
          deleteConfirm: t('删除该会话？', 'Delete this chat?'),
          deleteProviderConfirm: t('删除该 Provider？', 'Delete this provider?'),
          use: t('使用', 'Use'),
          del: t('删除', 'Delete'),
          edit: t('编辑', 'Edit'),
          partial: t(
            '（回复已中断，以上为已收到的部分内容）',
            '(interrupted — partial reply above)',
          ),
          untitled: t('未命名会话', 'Untitled chat'),
          noBridge: t('原生桥不可用。', 'Native bridge unavailable.'),
        }

        var el = function (id) {
          return document.getElementById(id)
        }
        var state = {
          sessionId: null,
          streaming: false,
          abort: null,
          editingProviderId: null,
        }

        el('title').textContent = strings.title
        el('back-btn').textContent = '‹ ' + strings.back
        el('sessions-btn').textContent = strings.sessions
        el('new-btn').textContent = strings.newChat
        el('provider-btn').textContent = strings.provider
        el('provider-title').textContent = strings.providerTitle
        el('label-base').textContent = strings.baseUrl
        el('label-key').textContent = strings.apiKey
        el('label-model').textContent = strings.model
        el('label-name').textContent = strings.name
        el('save-provider').textContent = strings.save
        el('test-provider').textContent = strings.test
        el('provider-hint').textContent = strings.providerHint
        el('sessions-title').textContent = strings.sessions
        el('send').textContent = strings.send
        el('empty').textContent = strings.empty

        function api(path, body) {
          var options =
            body === undefined
              ? { method: 'GET' }
              : {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(body),
                }
          return fetch(path, options).then(function (response) {
            return response
              .json()
              .catch(function () {
                return {}
              })
              .then(function (data) {
                if (!response.ok) throw new Error(data.error || 'HTTP ' + response.status)
                return data
              })
          })
        }

        function providerError(message) {
          el('provider-error').textContent = message || ''
          el('provider-ok').classList.add('hidden')
        }

        function setStreaming(streaming) {
          state.streaming = streaming
          el('send').textContent = streaming ? strings.stop : strings.send
        }

        function bubble(role, text) {
          var node = document.createElement('div')
          node.className = 'msg ' + role
          node.textContent = text
          el('chat').appendChild(node)
          el('chat').scrollTop = el('chat').scrollHeight
          return node
        }

        function renderMessages(session) {
          el('chat').innerHTML = ''
          el('empty').textContent = ''
          var messages = (session && session.messages) || []
          if (!messages.length) {
            el('empty').textContent = strings.emptyChat
            return
          }
          messages.forEach(function (message) {
            if (message.content) bubble(message.role, message.content)
          })
        }

        function loadSession(id) {
          return api('/api/local/sessions/get?id=' + encodeURIComponent(id)).then(function (data) {
            state.sessionId = data.session.id
            renderMessages(data.session)
          })
        }

        function refreshSessions() {
          return api('/api/local/sessions').then(function (data) {
            var list = el('session-list')
            list.innerHTML = ''
            ;(data.sessions || []).forEach(function (session) {
              var row = document.createElement('div')
              row.className = 'session-row'
              var info = document.createElement('div')
              var name = document.createElement('div')
              name.className = 'name'
              name.textContent = session.title || strings.untitled
              var meta = document.createElement('div')
              meta.className = 'meta'
              meta.textContent =
                session.messageCount + ' · ' + String(session.updatedAt || '').slice(0, 10)
              info.appendChild(name)
              info.appendChild(meta)
              var ops = document.createElement('span')
              ops.className = 'ops'
              var use = document.createElement('button')
              use.className = 'secondary'
              use.textContent = strings.use
              use.onclick = function () {
                el('sessions-panel').classList.add('hidden')
                loadSession(session.id).catch(function (error) {
                  bubble('system-note', String(error.message || error))
                })
              }
              var del = document.createElement('button')
              del.className = 'secondary'
              del.textContent = strings.del
              del.onclick = function () {
                if (!window.confirm(strings.deleteConfirm)) return
                api('/api/local/sessions/delete', { id: session.id })
                  .then(function () {
                    if (state.sessionId === session.id) {
                      state.sessionId = null
                      el('chat').innerHTML = ''
                      el('empty').textContent = strings.emptyChat
                    }
                    return refreshSessions()
                  })
                  .catch(function (error) {
                    bubble('system-note', String(error.message || error))
                  })
              }
              ops.appendChild(use)
              ops.appendChild(del)
              row.appendChild(info)
              row.appendChild(ops)
              list.appendChild(row)
            })
          })
        }

        function refreshProviders() {
          return api('/api/local/providers').then(function (data) {
            var list = el('provider-list')
            list.innerHTML = ''
            ;(data.providers || []).forEach(function (provider) {
              var row = document.createElement('div')
              row.className = 'provider-row' + (provider.id === data.activeId ? ' active' : '')
              var info = document.createElement('div')
              var name = document.createElement('div')
              name.className = 'name'
              name.textContent = provider.name + ' · ' + provider.model
              var meta = document.createElement('div')
              meta.className = 'meta'
              meta.textContent =
                provider.baseUrl + (provider.hasKey ? ' · …' + provider.keyHint : '')
              info.appendChild(name)
              info.appendChild(meta)
              var ops = document.createElement('span')
              ops.className = 'ops'
              var edit = document.createElement('button')
              edit.className = 'secondary'
              edit.textContent = strings.edit
              edit.onclick = function () {
                state.editingProviderId = provider.id
                el('input-base').value = provider.baseUrl
                el('input-model').value = provider.model
                el('input-name').value = provider.name
                el('input-key').value = ''
              }
              var del = document.createElement('button')
              del.className = 'secondary'
              del.textContent = strings.del
              del.onclick = function () {
                if (!window.confirm(strings.deleteProviderConfirm)) return
                api('/api/local/providers/delete', { id: provider.id })
                  .then(boot)
                  .catch(function (error) {
                    providerError(String(error.message || error))
                  })
              }
              ops.appendChild(edit)
              ops.appendChild(del)
              row.appendChild(info)
              row.appendChild(ops)
              list.appendChild(row)
            })
            return data
          })
        }

        function updateProviderTag(data) {
          var active = data && data.activeProvider
          el('provider-tag').textContent = active ? ' · ' + active.name + ' / ' + active.model : ''
        }

        function boot() {
          return api('/api/local/state').then(function (data) {
            updateProviderTag(data)
            if (!data.providerCount) {
              el('provider-panel').classList.remove('hidden')
              el('empty').textContent = strings.empty
            } else if (!state.sessionId) {
              el('empty').textContent = strings.emptyChat
            }
            return refreshProviders()
          })
        }

        function ensureSession() {
          if (state.sessionId) return Promise.resolve(state.sessionId)
          return api('/api/local/sessions/create', {}).then(function (data) {
            state.sessionId = data.session.id
            return state.sessionId
          })
        }

        function parseSse(buffer, onEvent) {
          // 以 \n\n 分帧；返回未收尾的残余部分继续缓冲。
          var rest = buffer
          var index
          while ((index = rest.indexOf('\n\n')) >= 0) {
            var frame = rest.slice(0, index)
            rest = rest.slice(index + 2)
            var event = ''
            var data = ''
            frame.split('\n').forEach(function (line) {
              if (line.indexOf('event:') === 0) event = line.slice(6).trim()
              else if (line.indexOf('data:') === 0) data += line.slice(5).replace(/^ /, '')
            })
            if (event && data) {
              try {
                onEvent(event, JSON.parse(data))
              } catch (ignore) {}
            }
          }
          return rest
        }

        function send() {
          if (state.streaming) {
            if (state.abort) state.abort.abort()
            return
          }
          var text = el('input').value
          if (!text.trim()) return
          el('input').value = ''
          el('empty').textContent = ''
          bubble('user', text)
          var assistant = bubble('assistant', '')
          assistant.classList.add('streaming')
          setStreaming(true)
          var controller = new AbortController()
          state.abort = controller
          var received = ''

          ensureSession()
            .then(function (sessionId) {
              return fetch('/api/local/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sessionId: sessionId, text: text }),
                signal: controller.signal,
              })
            })
            .then(function (response) {
              if (!response.ok || !response.body) {
                return response
                  .json()
                  .catch(function () {
                    return {}
                  })
                  .then(function (data) {
                    throw new Error(data.error || 'HTTP ' + response.status)
                  })
              }
              var reader = response.body.getReader()
              var decoder = new TextDecoder()
              var buffer = ''
              function pump() {
                return reader.read().then(function (result) {
                  if (result.done) return
                  buffer = parseSse(
                    buffer + decoder.decode(result.value, { stream: true }),
                    function (event, data) {
                      if (event === 'delta') {
                        received += data.text || ''
                        assistant.textContent = received
                        el('chat').scrollTop = el('chat').scrollHeight
                      } else if (event === 'error') {
                        assistant.classList.remove('streaming')
                        bubble(
                          'system-note',
                          String(data.message || 'error') +
                            (received ? '\n' + strings.partial : ''),
                        )
                      }
                    },
                  )
                  return pump()
                })
              }
              return pump()
            })
            .catch(function (error) {
              if (error && error.name === 'AbortError') {
                if (received) bubble('system-note', strings.partial)
              } else {
                bubble('system-note', String(error && error.message ? error.message : error))
              }
            })
            .finally(function () {
              assistant.classList.remove('streaming')
              if (!received && !assistant.textContent) assistant.remove()
              setStreaming(false)
              state.abort = null
              refreshSessions()
            })
        }

        el('send').onclick = send
        el('input').addEventListener('keydown', function (event) {
          if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
            event.preventDefault()
            send()
          }
        })
        el('new-btn').onclick = function () {
          state.sessionId = null
          el('chat').innerHTML = ''
          el('empty').textContent = strings.emptyChat
          el('input').focus()
        }
        el('sessions-btn').onclick = function () {
          el('provider-panel').classList.add('hidden')
          el('sessions-panel').classList.toggle('hidden')
          refreshSessions()
        }
        el('provider-btn').onclick = function () {
          el('sessions-panel').classList.add('hidden')
          el('provider-panel').classList.toggle('hidden')
          refreshProviders()
        }
        el('save-provider').onclick = function () {
          providerError('')
          api('/api/local/providers/upsert', {
            id: state.editingProviderId,
            name: el('input-name').value,
            baseUrl: el('input-base').value,
            apiKey: el('input-key').value || null,
            model: el('input-model').value,
          })
            .then(function () {
              state.editingProviderId = null
              el('input-key').value = ''
              return boot()
            })
            .then(function () {
              el('provider-panel').classList.add('hidden')
            })
            .catch(function (error) {
              providerError(String(error.message || error))
            })
        }
        function fillModelOptions(models) {
          var datalist = el('model-options')
          datalist.innerHTML = ''
          ;(models || []).forEach(function (id) {
            var option = document.createElement('option')
            option.value = id
            datalist.appendChild(option)
          })
        }

        el('test-provider').onclick = function () {
          providerError('')
          el('provider-ok').classList.add('hidden')
          el('test-provider').textContent = strings.connecting
          api('/api/local/providers/test', {})
            .then(function (result) {
              if (result.ok) {
                el('provider-ok').textContent = strings.testOk(result.models || [])
                el('provider-ok').classList.remove('hidden')
                // 测试成功即拿到模型列表，填入 model 输入框的候选。
                fillModelOptions(result.models)
              } else {
                providerError(result.error || 'failed')
              }
            })
            .catch(function (error) {
              providerError(String(error.message || error))
            })
            .finally(function () {
              el('test-provider').textContent = strings.test
            })
        }
        el('back-btn').onclick = function () {
          var tauri = window.__TAURI__ || null
          var invoke =
            (tauri && tauri.core && tauri.core.invoke) ||
            (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke)
          if (!invoke) return
          // 先记录离开本机模式，再回连接页（已配对时连接页会自动弹回远程 UI）。
          invoke('mobile_leave_local')
            .catch(function () {})
            .then(function () {
              return invoke('mobile_connect_url')
            })
            .then(function (url) {
              if (url) window.location.href = url
            })
            .catch(function () {})
        }

        // 输入框随内容伸缩，上限由 CSS max-height 控制。
        el('input').addEventListener('input', function () {
          el('input').style.height = 'auto'
          el('input').style.height = Math.min(el('input').scrollHeight, 120) + 'px'
        })

        boot().catch(function (error) {
          el('empty').textContent = String(error && error.message ? error.message : error)
        })
      })()
    </script>
  </body>
</html>
