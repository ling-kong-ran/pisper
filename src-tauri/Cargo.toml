[package]
name = "pisper-webview"
version = "0.3.2"
description = "Pisper system WebView desktop shell"
authors = ["ling-kong-ran"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "pisper_webview_lib"
# 移动端以 cdylib 形式链接进 App；rlib 保留给桌面与测试。
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# 商店包使用受限 embedded Runtime，并在编译期移除 rooted Runtime 与外部更新模块。
mobile-store = []

[[bin]]
name = "Pisper"
path = "src/main.rs"

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tauri = { version = "2.11.5", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.4"
tauri-plugin-barcode-scanner = "2"
time = { version = "0.3", features = ["formatting"] }
# 移动端本地代理依赖：纯 Rust + tokio，所有平台均可编译（便于桌面主机 check/test）。
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls-manual-roots",
  "stream",
  # 本机 Runtime 的 Provider 调用需要 JSON 收发；桌面宿主靠其他依赖间接开启，
  # 移动端目标必须显式声明，不能依赖特性统一的偶然性。
  "json",
] }
rustls = { version = "0.23", features = ["ring"] }
sha2 = "0.10"
# Phase B P2P：0.92 避免新版本 Windows WMI 冲突，并关闭非必需的 metrics/discovery 特性。
iroh = { version = "0.92.0", default-features = false }
rand = "0.8"
base64 = "0.22"
# 移动端首次启动从受信任 App 资产解出共享 Node Runtime 闭包；桌面测试也编译 mobile 模块。
flate2 = "1"
tar = "0.4"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
pisper-mobile-device-plugin = { path = "mobile-device-plugin" }

# Android bridge：tao 已初始化 Android 上下文，jni 版本须与 tao 0.35 保持一致。
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# 桌面端专属依赖：sidecar 管理、终端 PTY、托盘/窗口状态等在移动端无意义，
# 部分 crate（如 portable-pty）在 Android/iOS 上无法编译，必须按目标隔离。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
portable-pty = "0.9"
pisper-component-updater = { path = "../crates/component-updater" }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-window-state = "2.4.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"

[dev-dependencies]
# 代理集成测试用：自建 TLS 上游验证指纹锁定与 SSE 透传。
rcgen = "0.13"
tokio-rustls = "0.26"
