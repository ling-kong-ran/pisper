[package]
name = "pisper-webview"
version = "0.3.2"
description = "Pisper system WebView desktop shell"
authors = ["ling-kong-ran"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pisper_webview_lib"
crate-type = ["rlib"]

[[bin]]
name = "Pisper"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-single-instance = "2.4.3"
