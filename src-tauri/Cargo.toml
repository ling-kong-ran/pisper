[package]
name = "pisper-webview"
version = "0.3.2"
description = "Pisper system WebView desktop shell"
authors = ["ling-kong-ran"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lib]
name = "pisper_webview_lib"
# 移动端以 cdylib 形式链接进 App；rlib 保留给桌面与测试。
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# 所有移动构建仅使用 embedded Runtime；商店包额外移除外部更新并限制动态执行能力。
mobile-store = []

[[bin]]
name = "Pisper"
path = "src/main.rs"

[[test]]
name = "ios-build"
path = "mobile-device-plugin/ios_build.rs"

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
# webview-data-url：Computer Use 的指示窗口用 data: 页面（computer_control.rs），没有它 Tauri 直接拒绝建窗口。
tauri = { version = "2.11.5", features = ["tray-icon", "macos-private-api", "webview-data-url"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.4"
tauri-plugin-barcode-scanner = "2"
tauri-plugin-dns-sd = { path = "../crates/tauri-plugin-dns-sd" }
time = { version = "0.3", features = ["formatting"] }
# 移动端本地代理依赖：纯 Rust + tokio，所有平台均可编译（便于桌面主机 check/test）。
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
  # 更新清单等公开 HTTPS 请求需要可信 CA；桌面配对仍由 pinning.rs 的自定义 TLS 指纹验证。
  "rustls-tls-webpki-roots",
  "stream",
  # 本机 Runtime 的 Provider 调用需要 JSON 收发；桌面宿主靠其他依赖间接开启，
  # 移动端目标必须显式声明，不能依赖特性统一的偶然性。
  "json",
] }
rustls = { version = "0.23", features = ["ring"] }
sha2 = "0.10"
# P2P 隧道使用最新稳定 Iroh，并关闭非必需的 metrics/discovery 特性。
iroh = { version = "=1.1.0", default-features = false, features = ["tls-ring"] }
rand = "0.8"
base64 = "0.22"
# 移动端首次启动从受信任 App 资产解出共享 Node Runtime 闭包；桌面测试也编译 mobile 模块。
flate2 = "1"
tar = "0.4"
# Android 安装包里的 Runtime 归档用 brotli（比 gzip 小约三成）；纯 Rust 解码器，tauri 构建链已在用。
brotli-decompressor = "5"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
pisper-mobile-device-plugin = { path = "mobile-device-plugin" }

# Android bridge：tao 已初始化 Android 上下文，jni 版本须与 tao 0.35 保持一致。
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# 桌面端专属依赖：sidecar 管理、终端 PTY、托盘/窗口状态等在移动端无意义，
# 部分 crate（如 portable-pty）在 Android/iOS 上无法编译，必须按目标隔离。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
portable-pty = "0.9"
pisper-component-updater = { path = "../crates/component-updater" }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-window-state = "2.4.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["std", "exception", "verify"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSError", "NSString", "NSArray", "NSProcessInfo"] }
block2 = { version = "0.6", default-features = false, features = ["std", "alloc"] }

# 右侧浏览器的子 WebView（desktop_browser.rs）。版本跟随 tauri-runtime-wry，升级 Tauri 时一起看：
# 两边版本不同会编出两份 wry。Linux 不用：build_as_child 只支持 X11，右侧浏览器在那里继续用 iframe。
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
wry = { version = "0.55", default-features = false, features = ["protocol", "os-webview"] }

# Computer Use 的截屏和键鼠。手机端不需要。
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
computer-control = { path = "../crates/computer-control" }

[target.'cfg(windows)'.dependencies]
# 监听网页的 window.close()、把会话 Cookie 改成持久（desktop_browser.rs）。wry 没有这些接口；
# 版本跟随 wry，已在依赖树里（windows-core 用来把 ICoreWebView2 转成带 CookieManager 的接口）。
webview2-com = "0.38"
# 主窗口上自己挂一份主界面 WebView 的大小跟随（desktop_browser.rs 的 main_window）。版本跟随 Tauri，已在依赖树里。
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.61"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"

[dev-dependencies]
# Android Runtime 资产的 brotli 解包测试用。
brotli = "8"
# 代理集成测试用：自建 TLS 上游验证指纹锁定与 SSE 透传。
rcgen = "0.13"
tokio-rustls = "0.26"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
