[[permission]]
identifier = "allow-pisper-mobile-bridge"
description = "Allows the mobile shell to manage pairing, server selection, and App updates."
commands.allow = [
  "mobile_state",
  "mobile_pair",
  "mobile_pair_manual",
  "mobile_select_server",
  "mobile_enter_local",
  "mobile_leave_local",
  "mobile_forget_server",
  "mobile_get_device_capabilities",
  "mobile_set_device_capability",
  "mobile_request_device_permission",
  "mobile_open_device_settings",
  "mobile_execute_device_operation",
  "mobile_app_info",
  "mobile_check_app_update",
  "mobile_open_app_update",
]
