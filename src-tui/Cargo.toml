[package]
name = "pisper-tui"
version = "0.4.10"
description = "Terminal client for Pisper"
authors = ["ling-kong-ran"]
license = "MIT"
edition = "2021"
rust-version = "1.81"

[[bin]]
name = "pisper"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "6"
futures-util = "0.3"
getrandom = "0.2"
percent-encoding = "2"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
unicode-width = "0.2"
url = "2"
