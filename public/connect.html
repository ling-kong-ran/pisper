<!doctype html>
<!--
  移动端连接页（Tauri 内置资产，tauri 源）：未配对时的入口页，也是已配对后的
  服务器/模式管理中枢（远程 UI「添加服务器」与本机页「返回服务器」都落到这里）。
  功能：本机运行入口 / 扫码配对 / 手动配对（折叠子面板）/ 服务器列表管理。
  冷启动路由由壳内 Rust 侧按配对状态与模式记忆决定，本页不做自动跳转。
  刻意不依赖任何前端框架：该页在离线/无桌面端时也必须可用。
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <title>Pisper Connect</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --surface: #161b22;
        --border: #2d333b;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #4c8dff;
        --danger: #ef6d6d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100dvh;
        padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
      }
      .wrap { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
      h1 { font-size: 20px; margin: 24px 0 0; }
      .sub { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 4px 0 0; }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .card h2 { font-size: 15px; margin: 0; }
      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        padding: 12px;
        font-size: 15px;
        font-weight: 600;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
      button:disabled { opacity: 0.5; }
      input {
        width: 100%;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 14px;
      }
      label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
      .error { color: var(--danger); font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
      .server {
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
        border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
      }
      .server.active { border-color: var(--accent); }
      .server .name { font-size: 14px; overflow: hidden; text-overflow: ellipsis; }
      .server .ops { display: flex; gap: 8px; flex: none; }
      .server button { padding: 6px 10px; font-size: 12px; font-weight: 400; }
      .card.local { border-color: var(--accent); }
      .card.local h2 { display: flex; align-items: center; gap: 6px; }
      .hidden { display: none !important; }
      .divider { border-top: 1px solid var(--border); margin: 4px 0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div>
        <h1>Pisper</h1>
        <p class="sub" id="subtitle"></p>
      </div>

      <div class="card local">
        <h2 id="local-title"></h2>
        <p class="sub" id="local-desc"></p>
        <button id="local-btn"></button>
      </div>

      <div class="card hidden" id="servers-card">
        <h2 id="servers-title"></h2>
        <div id="servers"></div>
      </div>

      <div class="card">
        <h2 id="pair-title"></h2>
        <p class="sub" id="pair-desc"></p>
        <button id="scan-btn"></button>
        <button class="secondary" id="manual-toggle"></button>
        <div id="manual-panel" class="hidden">
          <div class="divider"></div>
          <div>
            <label id="label-url"></label>
            <input id="input-url" inputmode="url" autocapitalize="off" placeholder="https://192.168.1.5:5174" />
          </div>
          <div>
            <label id="label-code"></label>
            <input id="input-code" autocapitalize="characters" placeholder="ABCD-EFGH" />
          </div>
          <div>
            <label id="label-fp"></label>
            <input id="input-fp" autocapitalize="characters" placeholder="SHA256:1BA3FEB1…" />
          </div>
          <button id="manual-btn"></button>
          <p class="sub" id="manual-hint"></p>
        </div>
      </div>

      <p class="error" id="error"></p>
    </div>
    <script src="connect.js"></script>
  </body>
</html>
