name: Release desktop apps

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate version and generate release notes
        run: node scripts/prepare-release.mjs "${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          if-no-files-found: error
          path: |
            release-body.md
            public/release-notes.json

  quality:
    name: Verify release source
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Build Linux SEA sidecar for Rust checks
        run: npm run sidecar:sea
      - name: Check Rust shell
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  build:
    name: Build ${{ matrix.name }}
    needs: [prepare, quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            target: windows-x86_64
            os: windows-latest
          - name: macOS Intel
            target: darwin-x86_64
            os: macos-15-intel
          - name: macOS Apple Silicon
            target: darwin-aarch64
            os: macos-15
          - name: Linux x64
            target: linux-x86_64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ startsWith(matrix.target, 'darwin-') && secrets.APPLE_CERTIFICATE || '' }}
      APPLE_CERTIFICATE_PASSWORD: ${{ startsWith(matrix.target, 'darwin-') && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
      APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.target, 'darwin-') && secrets.APPLE_SIGNING_IDENTITY || '' }}
      APPLE_ID: ${{ startsWith(matrix.target, 'darwin-') && secrets.APPLE_ID || '' }}
      APPLE_PASSWORD: ${{ startsWith(matrix.target, 'darwin-') && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ startsWith(matrix.target, 'darwin-') && secrets.APPLE_TEAM_ID || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/download-artifact@v5
        with:
          name: release-metadata
          path: .
      - run: npm ci
      - name: Require Tauri updater signing credentials
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "TAURI_SIGNING_PRIVATE_KEY is not configured." >&2; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not configured." >&2; exit 1; }
      - name: Build SEA sidecar, verify Agent, and package Tauri
        run: npm run desktop:webview:build
      - uses: actions/upload-artifact@v4
        with:
          name: pisper-tauri-${{ matrix.target }}
          if-no-files-found: error
          path: release/tauri-artifacts

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v5
        with:
          name: release-metadata
          path: .
      - uses: actions/download-artifact@v5
        with:
          pattern: pisper-tauri-*
          path: artifacts
          merge-multiple: true
      - name: Stage Electron transition assets for v0.4.0
        if: github.ref_name == 'v0.4.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.3.3 --repo "${{ github.repository }}" --dir artifacts/electron-transition
      - name: Create multi-platform updater manifest
        run: node scripts/create-tauri-update-manifest.mjs "${{ github.ref_name }}" artifacts --require-all --output artifacts/latest.json
      - name: Validate exact release asset set
        run: node scripts/validate-tauri-release-assets.mjs "${{ github.ref_name }}" artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: Pisper ${{ github.ref_name }}
          body_path: release-body.md
          fail_on_unmatched_files: true
          make_latest: true
          files: artifacts/**/*
      - name: Synchronize release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "Pisper ${{ github.ref_name }}" --notes-file release-body.md --latest
