name: Release desktop apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (X.Y.Z)'
        required: true
        type: string
      source_sha:
        description: 'Exact release branch commit to build'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_TAG: v${{ inputs.version }}
  RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}

jobs:
  prepare:
    name: Prepare staged release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Verify immutable release branch source
        shell: bash
        run: |
          git fetch origin release
          remote_source="$(git rev-parse origin/release)"
          test "$remote_source" = "$RELEASE_SOURCE_SHA" || {
            echo "release source must equal origin/release: expected $RELEASE_SOURCE_SHA, found $remote_source" >&2
            exit 1
          }
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh staged release dependencies
        run: |
          npm update
          cargo update --manifest-path src-tui/Cargo.toml
      - name: Stage version without committing or tagging
        run: node scripts/stage-release-version.mjs "$RELEASE_VERSION" "$RELEASE_SOURCE_SHA"
      - name: Generate release notes from the immutable source
        run: node scripts/prepare-release.mjs "$RELEASE_TAG" "$RELEASE_SOURCE_SHA"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-source
          if-no-files-found: error
          path: |
            package.json
            package-lock.json
            src-tui/Cargo.toml
            src-tui/Cargo.lock
            release-body.md
            public/release-notes.json

  quality:
    name: Verify staged release source
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/download-artifact@v5
        with:
          name: release-source
          path: .
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Build desktop sidecars for Rust checks
        run: |
          npm run sidecar:sea
          npm run tui:stage
      - name: Check Rust clients
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tui/Cargo.toml
          cargo clippy --manifest-path src-tui/Cargo.toml --all-targets -- -D warnings

  build:
    name: Build ${{ matrix.name }}
    needs: [prepare, quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            target: windows-x86_64
            os: windows-latest
          - name: macOS Intel
            target: darwin-x86_64
            os: macos-15-intel
          - name: macOS Apple Silicon
            target: darwin-aarch64
            os: macos-15
          - name: Linux x64
            target: linux-x86_64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ startsWith(matrix.target, 'darwin-') && secrets.APPLE_CERTIFICATE || '' }}
      APPLE_CERTIFICATE_PASSWORD: ${{ startsWith(matrix.target, 'darwin-') && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
      APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.target, 'darwin-') && secrets.APPLE_SIGNING_IDENTITY || '' }}
      APPLE_ID: ${{ startsWith(matrix.target, 'darwin-') && secrets.APPLE_ID || '' }}
      APPLE_PASSWORD: ${{ startsWith(matrix.target, 'darwin-') && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ startsWith(matrix.target, 'darwin-') && secrets.APPLE_TEAM_ID || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: release-source
          path: .
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Require Tauri updater signing credentials
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "TAURI_SIGNING_PRIVATE_KEY is not configured." >&2; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not configured." >&2; exit 1; }
      - name: Build SEA sidecar, verify Agent, and package Tauri
        run: npm run desktop:webview:build
      - uses: actions/upload-artifact@v4
        with:
          name: pisper-tauri-${{ matrix.target }}
          if-no-files-found: error
          path: release/tauri-artifacts

  release:
    name: Finalize version and publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v5
        with:
          name: release-source
          path: .
      - uses: actions/download-artifact@v5
        with:
          pattern: pisper-tauri-*
          path: artifacts
          merge-multiple: true
      - name: Create multi-platform updater manifest
        run: node scripts/create-tauri-update-manifest.mjs "$RELEASE_TAG" artifacts --require-all --output artifacts/latest.json
      - name: Validate exact release asset set
        run: node scripts/validate-tauri-release-assets.mjs "$RELEASE_TAG" artifacts
      - name: Commit version, upload a draft, and publish atomically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: release
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          remote_source="$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | cut -f1)"
          test "$remote_source" = "$RELEASE_SOURCE_SHA" || {
            echo "release branch moved: expected $RELEASE_SOURCE_SHA, found $remote_source" >&2
            exit 1
          }
          test -z "$(git ls-remote origin "refs/tags/$RELEASE_TAG")" || {
            echo "tag already exists: $RELEASE_TAG" >&2
            exit 1
          }

          git add package.json package-lock.json src-tui/Cargo.toml src-tui/Cargo.lock
          git diff --cached --quiet && {
            echo "staged release has no version changes" >&2
            exit 1
          }
          git commit -m "chore(release): $RELEASE_TAG"
          release_commit="$(git rev-parse HEAD)"
          git tag "$RELEASE_TAG"

          pushed=0
          rollback() {
            status=$?
            trap - ERR
            gh release delete "$RELEASE_TAG" --yes >/dev/null 2>&1 || true
            if [ "$pushed" = 1 ]; then
              git push --atomic \
                --force-with-lease="refs/heads/$RELEASE_BRANCH:$release_commit" \
                origin \
                "$RELEASE_SOURCE_SHA:refs/heads/$RELEASE_BRANCH" \
                ":refs/tags/$RELEASE_TAG" || true
            fi
            exit "$status"
          }
          trap rollback ERR

          git push --atomic origin \
            "HEAD:refs/heads/$RELEASE_BRANCH" \
            "refs/tags/$RELEASE_TAG"
          pushed=1

          mapfile -d '' assets < <(find artifacts -type f -print0)
          gh release create "$RELEASE_TAG" \
            --draft \
            --verify-tag \
            --title "Pisper $RELEASE_TAG" \
            --notes-file release-body.md \
            "${assets[@]}"
          gh release edit "$RELEASE_TAG" \
            --draft=false \
            --latest \
            --title "Pisper $RELEASE_TAG" \
            --notes-file release-body.md

          trap - ERR
          echo "Published $RELEASE_TAG from $release_commit"
