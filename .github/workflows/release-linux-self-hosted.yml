name: Release from self-hosted Linux

# 在自托管 Linux x64 上复用既有计划；Tauri 更新签名由 Secrets 注入。
on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to run against an existing draft plan'
        required: true
        default: build
        type: choice
        options:
          - build
          - status
          - publish
  # 推 self-release-* 标签时由 release-self-hosted-tag.yml 调用。
  workflow_call:
    inputs:
      stage:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-self-hosted-${{ github.repository }}-${{ inputs.stage == 'publish' && 'publish' || format('linux-{0}', inputs.stage) }}
  cancel-in-progress: false

jobs:
  release:
    name: Linux x64 release (${{ inputs.stage }})
    # 只选择明确登记了 pisper-linux 自定义标签的自托管 Runner，不消耗托管额度。
    runs-on: [self-hosted, pisper-linux]
    timeout-minutes: 360
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      # 不继承个人 Git URL rewrite；checkout 和 publish 都使用注入的 GitHub Token。
      GIT_CONFIG_GLOBAL: ${{ github.workspace }}/../pisper-release-gitconfig-${{ github.run_id }}
      GIT_CONFIG_NOSYSTEM: '1'
    steps:
      - name: Require Linux x64
        shell: bash
        run: |
          if [[ "$RUNNER_OS" != "Linux" || "$RUNNER_ARCH" != "X64" ]]; then
            echo "This workflow requires Linux x64, got $RUNNER_OS $RUNNER_ARCH." >&2
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: release
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # Rust 1.100 起 Cargo 的 build 目录多一层（build/<包>/<hash>/out），tauri-build 2.6 由此推算的
      # target 目录错位，外部程序和资源复制错地方，桌面打包失败；升到 tauri-build 2.7.4+ 后改回 stable。
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - name: Install Node dependencies
        run: npm ci
      - name: Configure release commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Build and upload Linux artifacts
        if: inputs.stage == 'build'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # 计划可能已经更新依赖，构建必须服从当前锁文件并执行完整安装。
        run: npm run release:local -- build
      - name: Inspect draft release assets
        if: inputs.stage == 'build' || inputs.stage == 'status' || inputs.stage == 'publish'
        run: npm run release:local -- status
      - name: Publish validated draft releases
        if: inputs.stage == 'publish'
        # 三个平台都在的计划会发 npm：自托管 Runner 用不了 npm 的可信发布（OIDC），只能用令牌。
        # 没配这个 Secret 时，标签流程在 plan 时就加了 --no-npm，这里用不到它。
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm run release:local -- publish
