name: Publish npm CLI

on:
  workflow_dispatch:
    inputs:
      npm_version:
        description: 'pisper npm version (X.Y.Z)'
        required: true
        type: string
      tui_version:
        description: 'Signed TUI release version bundled by the installer'
        required: false
        type: string
      runtime_version:
        description: 'Signed Runtime release version installed by the installer'
        required: false
        type: string
      source_sha:
        description: 'Exact release branch commit to publish'
        required: true
        type: string
  workflow_call:
    inputs:
      npm_version:
        required: true
        type: string
      tui_version:
        required: false
        type: string
      runtime_version:
        required: false
        type: string
      source_sha:
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

env:
  NPM_VERSION: ${{ inputs.npm_version }}
  NPM_TAG: npm-v${{ inputs.npm_version }}
  TUI_VERSION: ${{ inputs.tui_version }}
  RUNTIME_VERSION: ${{ inputs.runtime_version }}
  RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}

jobs:
  publish:
    name: Publish pisper@${{ inputs.npm_version }}
    runs-on: ubuntu-latest
    # 构建可以并行，提交版本号并打标签这一步逐个执行：各通道都向 release 推版本提交，
    # 排到时先取最新 release 再重放本通道的提交。GitHub 并发组只留一个在跑、一个在等，
    # 第三个到来会取消在等的那个；按 release.mjs 的编排（TUI/Runtime 约 10 分钟、App 约 30 分钟、
    # Desktop 在 TUI/Runtime 之后）正常不会撞上。万一被取消，重推触发标签即可，已发布的通道会自动跳过。
    concurrency:
      group: release-publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Verify immutable release source
        shell: bash
        run: |
          git fetch origin release
          node scripts/verify-release-head.mjs "$RELEASE_SOURCE_SHA" origin/release
      - name: Install source dependencies
        run: npm ci
      - name: Build bundled Web frontend
        run: npm run build
      - name: Stage independent npm package version
        run: >-
          node scripts/stage-npm-release-version.mjs
          "$NPM_VERSION" "$TUI_VERSION" "$RUNTIME_VERSION" "$RELEASE_SOURCE_SHA"
      - name: Validate signed component targets
        run: node scripts/validate-npm-targets.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Pack and validate registry launcher contents
        run: npm run npm:pack:check
      - name: Download signed component archives for npm platform packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release/npm/component-artifacts
          gh release download "tui-v$TUI_VERSION" \
            --dir release/npm/component-artifacts \
            --pattern "Pisper_TUI_Component_${TUI_VERSION}_*.tar.gz" \
            --pattern "Pisper_TUI_Component_${TUI_VERSION}_*.tar.gz.sig"
          gh release download "runtime-v$RUNTIME_VERSION" \
            --dir release/npm/component-artifacts \
            --pattern "Pisper_Runtime_Node_${RUNTIME_VERSION}_*.tar.gz" \
            --pattern "Pisper_Runtime_Node_${RUNTIME_VERSION}_*.tar.gz.sig"
      - name: Pack platform-specific npm contents
        run: node scripts/package-npm-platforms.mjs
      - name: Smoke-test the packed launcher without a GitHub download
        shell: bash
        run: |
          npm install \
            --prefix release/npm/smoke \
            --omit=optional \
            --ignore-scripts \
            "release/npm/tarballs/pisper-${NPM_VERSION}.tgz"
          platform_dir="release/npm/smoke/node_modules/pisper-binary-linux-x64"
          mkdir -p "$platform_dir"
          tar -xzf "release/npm/tarballs/pisper-${NPM_VERSION}-linux-x64.0.tgz" \
            -C "$platform_dir" \
            --strip-components=1
          PISPER_NPM_INSTALL_DIR="$PWD/release/npm/smoke-data" node -e \
            "import('./release/npm/smoke/node_modules/pisper/lib/install.mjs').then(async m => { const p = await m.ensurePisperInstallation(); if (!p.executable || !p.appRoot || p.sidecar) process.exit(1) })"
      - name: Check whether the version is already published
        id: registry
        shell: bash
        run: |
          platform_versions=(
            "$NPM_VERSION-win32-x64.0"
            "$NPM_VERSION-darwin-x64.0"
            "$NPM_VERSION-darwin-arm64.0"
            "$NPM_VERSION-linux-x64.0"
          )
          if npm view "pisper@$NPM_VERSION" version --json >/dev/null 2>&1; then
            for version in "${platform_versions[@]}"; do
              npm view "pisper@$version" version --json >/dev/null 2>&1 || {
                echo "pisper@$NPM_VERSION exists without platform package $version" >&2
                exit 1
              }
            done
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "pisper@$NPM_VERSION and all platform packages are already published."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit version metadata, tag, and publish
        if: steps.registry.outputs.exists != 'true'
        shell: bash
        env:
          RELEASE_BRANCH: release
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$RELEASE_BRANCH"
          remote_source="$(git rev-parse "origin/$RELEASE_BRANCH")"
          node scripts/verify-release-head.mjs "$RELEASE_SOURCE_SHA" "$remote_source"
          test -z "$(git ls-remote origin "refs/tags/$NPM_TAG")" || {
            echo "tag already exists without a published npm version: $NPM_TAG" >&2
            exit 1
          }

          git add packages/pisper/package.json
          git diff --cached --quiet && {
            echo "staged npm release has no version changes" >&2
            exit 1
          }
          git commit -m "chore(release-npm): $NPM_TAG"
          if [ "$remote_source" != "$RELEASE_SOURCE_SHA" ]; then
            git rebase --onto "$remote_source" "$RELEASE_SOURCE_SHA" HEAD
          fi
          release_commit="$(git rev-parse HEAD)"
          git tag "$NPM_TAG"

          pushed=0
          rollback() {
            status=$?
            trap - ERR
            if [ "$pushed" = 1 ]; then
              git push --atomic \
                --force-with-lease="refs/heads/$RELEASE_BRANCH:$release_commit" \
                origin \
                "$remote_source:refs/heads/$RELEASE_BRANCH" \
                ":refs/tags/$NPM_TAG" || true
            fi
            exit "$status"
          }
          trap rollback ERR
          git push --atomic origin \
            "HEAD:refs/heads/$RELEASE_BRANCH" \
            "refs/tags/$NPM_TAG"
          pushed=1

          publish_platform() {
            slug="$1"
            version="$NPM_VERSION-$slug.0"
            tarball="release/npm/tarballs/pisper-$version.tgz"
            if npm view "pisper@$version" version --json >/dev/null 2>&1; then
              echo "pisper@$version is already published; reusing it."
            else
              npm publish "$tarball" \
                --access public \
                --provenance \
                --tag "platform-$slug"
            fi
          }
          publish_platform win32-x64
          publish_platform darwin-x64
          publish_platform darwin-arm64
          publish_platform linux-x64
          npm publish "release/npm/tarballs/pisper-$NPM_VERSION.tgz" \
            --access public \
            --provenance
          trap - ERR
          echo "Published pisper@$NPM_VERSION and its four npm platform packages from $release_commit"
