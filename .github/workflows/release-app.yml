name: Release app

# 移动端 App 独立发版：与 release.yml（desktop/tui/runtime）完全解耦。
# 产物：签名 APK（Android）+ 未签名 iOS 构建（需用户自行重签名）。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App release version (X.Y.Z)'
        required: true
        type: string
      source_sha:
        description: 'Exact release branch commit to build'
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_TAG: app-v${{ inputs.version }}
  RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}

jobs:
  prepare:
    name: Prepare staged app release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Verify immutable release branch source
        shell: bash
        run: |
          git fetch origin release
          node scripts/verify-release-head.mjs "$RELEASE_SOURCE_SHA" origin/release
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Stage app version, release notes, and latest-app manifest
        run: node scripts/prepare-app-release.mjs "$RELEASE_TAG" "$RELEASE_SOURCE_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-source
          if-no-files-found: error
          path: |
            src-tauri/mobile-package.json
            docs/latest-app.json
            release-body-app.md

  embedded-runtime:
    name: Build shared embedded Runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Build frontend and embedded Runtime closure
        env:
          PISPER_APP_VERSION: ${{ inputs.version }}
        run: |
          npm run build
          npm run mobile:runtime
          tar -xOzf release/pisper-embedded-runtime.tar.gz ./embedded-runtime.json |
            jq -e '.appVersion == "${{ inputs.version }}" and .runtimeProfile == "mobile-embedded"'
          tar -tzf release/pisper-embedded-runtime.tar.gz | grep -Fx './runtime/mobile-embedded.mjs'
          tar -tzf release/pisper-embedded-runtime.tar.gz | grep -Fx './dist/index.html'
      - name: Sign embedded Runtime closure
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx tauri signer sign release/pisper-embedded-runtime.tar.gz
          mv release/pisper-embedded-runtime.tar.gz.sig \
            release/pisper-embedded-runtime.tar.gz.minisig
      - uses: actions/upload-artifact@v4
        with:
          name: app-embedded-runtime
          if-no-files-found: error
          path: release/pisper-embedded-runtime.tar.gz*

  root-runtime:
    name: Build rooted Android Runtime
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Build Linux SEA and frontend
        run: npm run sidecar:sea
      - name: Build rooted Android Runtime asset
        env:
          PISPER_APP_VERSION: ${{ inputs.version }}
          PISPER_ROOT_RUNTIME_ARCH: arm64
        run: npm run android:root-runtime
      - name: Validate and sign rooted Android Runtime
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          archive=release/pisper-root-runtime-android-arm64.tar.gz
          gzip -t "$archive"
          tar -tzf "$archive" | grep -Fx './opt/pisper/pisper-sidecar'
          tar -tzf "$archive" | grep -Fx './usr/bin/setpriv'
          tar -tzf "$archive" | grep -Fx './usr/bin/rg'
          npx tauri signer sign "$archive"
          mv "$archive.sig" "$archive.minisig"
      - uses: actions/upload-artifact@v4
        with:
          name: app-root-runtime
          if-no-files-found: error
          path: release/pisper-root-runtime-android-arm64.tar.gz*

  android:
    name: Build signed Android APK
    needs: [prepare, root-runtime, embedded-runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.3.13750724"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Node dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5
      - name: Verify and stage fixed Android Node 24
        run: node scripts/stage-mobile-node-android.mjs release/mobile-node-android --require-sigstore
      - name: Prepare Android project with embedded Node
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.3.13750724
          PISPER_NODE_MOBILE_ANDROID_DIR: ${{ github.workspace }}/release/mobile-node-android
          PISPER_REQUIRE_EMBEDDED_NODE: '1'
        run: node scripts/setup-mobile-android.mjs
      - uses: actions/download-artifact@v5
        with:
          name: app-embedded-runtime
          path: embedded-runtime
      - uses: actions/download-artifact@v5
        with:
          name: app-root-runtime
          path: root-runtime
      - name: Verify and stage mobile Runtime assets
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          node scripts/verify-tauri-signature.mjs \
            embedded-runtime/pisper-embedded-runtime.tar.gz \
            embedded-runtime/pisper-embedded-runtime.tar.gz.minisig
          node scripts/verify-tauri-signature.mjs \
            root-runtime/pisper-root-runtime-android-arm64.tar.gz \
            root-runtime/pisper-root-runtime-android-arm64.tar.gz.minisig
          mkdir -p src-tauri/gen/android/app/src/main/assets
          cp embedded-runtime/pisper-embedded-runtime.tar.gz \
            src-tauri/gen/android/app/src/main/assets/pisper-embedded-runtime.tgz
          cp root-runtime/pisper-root-runtime-android-arm64.tar.gz \
            src-tauri/gen/android/app/src/main/assets/pisper-root-runtime-android-arm64.tgz
      - name: Build release APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.3.13750724
        run: |
          node node_modules/@tauri-apps/cli/tauri.js android build --apk --ci --target aarch64 \
            --config '{"version":"${{ inputs.version }}","bundle":{"externalBin":[],"resources":[]}}'
      - name: Sign APK
        env:
          APP_ANDROID_KEYSTORE: ${{ secrets.APP_ANDROID_KEYSTORE }}
          APP_ANDROID_STORE_PASSWORD: ${{ secrets.APP_ANDROID_STORE_PASSWORD }}
          APP_ANDROID_KEY_ALIAS: ${{ secrets.APP_ANDROID_KEY_ALIAS }}
          APP_ANDROID_KEY_PASSWORD: ${{ secrets.APP_ANDROID_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$APP_ANDROID_KEYSTORE" || { echo "APP_ANDROID_KEYSTORE 未配置。" >&2; exit 1; }
          echo "$APP_ANDROID_KEYSTORE" | base64 -d > /tmp/pisper-app.jks
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name '*unsigned*.apk' | head -1)
          test -n "$UNSIGNED" || { echo "未找到未签名 APK。" >&2; exit 1; }
          unzip -l "$UNSIGNED" | grep -F 'assets/pisper-root-runtime-android-arm64.tgz'
          unzip -l "$UNSIGNED" | grep -F 'assets/pisper-embedded-runtime.tgz'
          unzip -l "$UNSIGNED" | grep -F 'assets/pisper-embedded-node-android.json'
          unzip -l "$UNSIGNED" | grep -F 'lib/arm64-v8a/libnode.so'
          unzip -l "$UNSIGNED" | grep -F 'lib/arm64-v8a/libc++_shared.so'
          unzip -l "$UNSIGNED" | grep -F 'lib/arm64-v8a/libpisper_node_host.so'
          unzip -l "$UNSIGNED" | grep -F 'lib/arm64-v8a/libpisper_webview_lib.so'
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -p -f 4 "$UNSIGNED" /tmp/app-aligned.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks /tmp/pisper-app.jks \
            --ks-key-alias "$APP_ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$APP_ANDROID_STORE_PASSWORD" \
            --key-pass "pass:$APP_ANDROID_KEY_PASSWORD" \
            --out app-universal-release-signed.apk \
            /tmp/app-aligned.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs app-universal-release-signed.apk | head -2
      - name: Minisign APK
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx tauri signer sign app-universal-release-signed.apk
          mv app-universal-release-signed.apk.sig app-universal-release-signed.apk.minisig
      - uses: actions/upload-artifact@v4
        with:
          name: app-android
          if-no-files-found: error
          path: app-universal-release-signed.apk*

  ios:
    name: Build iOS app (unsigned)
    needs: [prepare, embedded-runtime]
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Install Node dependencies
        run: npm ci
      - name: Build fixed iOS Node 24 framework
        run: npm run mobile:node:ios
      - name: Sign, verify, and restage iOS Node framework
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          brew install minisign
          (
            cd release/mobile-node-ios
            shasum -a 256 -c SHA256SUMS
          )
          tar -czf release/pisper-node-mobile-ios.tar.gz -C release/mobile-node-ios .
          npx tauri signer sign release/pisper-node-mobile-ios.tar.gz
          mv release/pisper-node-mobile-ios.tar.gz.sig \
            release/pisper-node-mobile-ios.tar.gz.minisig
          node scripts/verify-tauri-signature.mjs \
            release/pisper-node-mobile-ios.tar.gz \
            release/pisper-node-mobile-ios.tar.gz.minisig
          rm -rf release/mobile-node-ios
          mkdir -p release/mobile-node-ios
          tar -xzf release/pisper-node-mobile-ios.tar.gz -C release/mobile-node-ios
          test -d release/mobile-node-ios/NodeMobile.xcframework
      - uses: actions/download-artifact@v5
        with:
          name: app-embedded-runtime
          path: embedded-runtime
      - name: Verify shared embedded Runtime
        run: |
          set -Eeuo pipefail
          node scripts/verify-tauri-signature.mjs \
            embedded-runtime/pisper-embedded-runtime.tar.gz \
            embedded-runtime/pisper-embedded-runtime.tar.gz.minisig
          cp embedded-runtime/pisper-embedded-runtime.tar.gz release/pisper-embedded-runtime.tar.gz
      - name: Smoke embedded Pisper Runtime in iOS Simulator
        run: |
          scripts/smoke-mobile-node-ios.sh \
            "$PWD/release/mobile-node-ios-work/materialized" \
            "$PWD/release/mobile-node-ios/NodeMobile.xcframework" \
            "$PWD/release/pisper-embedded-runtime.tar.gz"
      - name: Build frontend
        run: npm run build
      - name: Generate shared mobile icons
        run: node scripts/sync-mobile-icons.mjs
      - name: Prepare iOS project with embedded Node
        run: |
          MOBILE_CONFIG='{"bundle":{"externalBin":[],"resources":{"../release/pisper-embedded-runtime.tar.gz":"pisper-embedded-runtime.tar.gz"},"iOS":{"frameworks":["../release/mobile-node-ios/NodeMobile.xcframework"]}}}'
          npx tauri ios init --config "$MOBILE_CONFIG"
      - name: Build unsigned iOS app
        run: |
          MOBILE_CONFIG='{"version":"${{ inputs.version }}","bundle":{"externalBin":[],"resources":{"../release/pisper-embedded-runtime.tar.gz":"pisper-embedded-runtime.tar.gz"},"iOS":{"frameworks":["../release/mobile-node-ios/NodeMobile.xcframework"]}}}'
          npx tauri ios build --ci --no-sign --config "$MOBILE_CONFIG"
      - name: Package iOS artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          IPA_PATH=$(find src-tauri/gen/apple -name "*.ipa" -type f | head -1)
          test -n "$IPA_PATH" || { echo "未找到未签名 IPA 产物。" >&2; exit 1; }
          cp "$IPA_PATH" pisper-ios-unsigned.ipa
          cp release/pisper-node-mobile-ios.tar.gz* .
          npx tauri signer sign pisper-ios-unsigned.ipa
          mv pisper-ios-unsigned.ipa.sig pisper-ios-unsigned.ipa.minisig
          cat > README-ios.txt <<'EOF'
          该 IPA 为未签名产物（不含 provisioning profile），已内置同源 Node/Pisper Runtime。
          安装到真机需自行重签名：AltStore / Sideloadly / 自有开发者账号。
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: app-ios
          if-no-files-found: error
          path: |
            pisper-ios-*
            pisper-node-mobile-ios.tar.gz*
            README-ios.txt

  publish:
    name: Publish $RELEASE_TAG
    needs: [prepare, embedded-runtime, root-runtime, android, ios]
    if: ${{ always() && needs.prepare.result == 'success' && needs['embedded-runtime'].result == 'success' && needs['root-runtime'].result == 'success' && needs.android.result == 'success' && needs.ios.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v5
        with:
          name: app-release-source
          path: .
      - uses: actions/download-artifact@v5
        with:
          name: app-android
          path: artifacts
      - uses: actions/download-artifact@v5
        with:
          name: app-ios
          path: artifacts
      - uses: actions/download-artifact@v5
        with:
          name: app-root-runtime
          path: artifacts
      - uses: actions/download-artifact@v5
        with:
          name: app-embedded-runtime
          path: artifacts
      - name: Validate required assets
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f artifacts/app-universal-release-signed.apk
          test -f artifacts/app-universal-release-signed.apk.minisig
          test -f artifacts/pisper-ios-unsigned.ipa
          test -f artifacts/pisper-ios-unsigned.ipa.minisig
          test -f artifacts/README-ios.txt
          test -f artifacts/pisper-root-runtime-android-arm64.tar.gz
          test -f artifacts/pisper-root-runtime-android-arm64.tar.gz.minisig
          test -f artifacts/pisper-embedded-runtime.tar.gz
          test -f artifacts/pisper-embedded-runtime.tar.gz.minisig
          test -f artifacts/pisper-node-mobile-ios.tar.gz
          test -f artifacts/pisper-node-mobile-ios.tar.gz.minisig
          ls -la artifacts
      - name: Commit app version, upload a draft, and publish atomically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: release
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "$RELEASE_BRANCH"
          remote_source="$(git rev-parse "origin/$RELEASE_BRANCH")"
          node scripts/verify-release-head.mjs "$RELEASE_SOURCE_SHA" "$remote_source"
          test -z "$(git ls-remote origin "refs/tags/$RELEASE_TAG")" || {
            echo "tag already exists: $RELEASE_TAG" >&2
            exit 1
          }

          git add src-tauri/mobile-package.json docs/latest-app.json
          git diff --cached --quiet && {
            echo "staged release has no version changes" >&2
            exit 1
          }
          git commit -m "chore(release-app): $RELEASE_TAG"
          if [ "$remote_source" != "$RELEASE_SOURCE_SHA" ]; then
            git rebase --onto "$remote_source" "$RELEASE_SOURCE_SHA" HEAD
          fi
          release_commit="$(git rev-parse HEAD)"
          git tag "$RELEASE_TAG"

          pushed=0
          rollback() {
            status=$?
            trap - ERR
            gh release delete "$RELEASE_TAG" --yes >/dev/null 2>&1 || true
            if [ "$pushed" = 1 ]; then
              git push --atomic \
                --force-with-lease="refs/heads/$RELEASE_BRANCH:$release_commit" \
                origin \
                "$remote_source:refs/heads/$RELEASE_BRANCH" \
                ":refs/tags/$RELEASE_TAG" || true
            fi
            exit "$status"
          }
          trap rollback ERR

          git push --atomic origin \
            "HEAD:refs/heads/$RELEASE_BRANCH" \
            "refs/tags/$RELEASE_TAG"
          pushed=1

          mapfile -d '' assets < <(find artifacts -type f -print0)
          title="Pisper App $RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            --draft \
            --verify-tag \
            --title "$title" \
            --notes-file release-body-app.md \
            "${assets[@]}"
          gh release edit "$RELEASE_TAG" \
            --draft=false \
            --latest=false \
            --title "$title" \
            --notes-file release-body-app.md

          trap - ERR
          echo "Published $RELEASE_TAG from $release_commit"

          # GITHUB_TOKEN 推送不会触发 push 工作流，需显式刷新首页下载清单。
          gh workflow run pages.yml --ref "$RELEASE_BRANCH" || \
            echo "::warning::App 已发布，但首页部署派发失败，请手动运行 pages.yml。"
