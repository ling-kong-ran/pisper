name: Release from self-hosted trigger tag

# GitHub 托管额度用尽时的标签发布，全程只用自托管 Runner：
#   git push origin release:refs/tags/self-release-patch
# 也可以推 self-release-minor / self-release-major / self-release-X.Y.Z。托管额度够时仍推 release-*（release-tag.yml）。
# 步骤与手动的本机发布相同：Linux 上 plan（发布前检查、建草稿）→ Windows、macOS、Linux 各自 build 并上传到草稿
# → Linux 上 publish（校验产物、提交版本号、打标签、发布草稿，有 NPM_TOKEN 时发 npm）→ 有 App 变更时再发 App。
# 触发标签用后即删；中途失败时修好后可以从失败的那一步手动重跑对应的自托管 workflow（stage=build / publish），
# 不要再推一次标签：草稿里已有计划，plan 会拒绝再建一份。
on:
  push:
    tags:
      - 'self-release-*'

permissions:
  contents: write
  actions: write

# 和 release-tag.yml 同一分组：两条标签发布不会同时跑。被调用的各 workflow 用各自的分组，不会互相等死。
concurrency:
  group: release-trigger-${{ github.repository }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan ${{ github.ref_name }}
    # 只选择明确登记了 pisper-linux 自定义标签的自托管 Runner，不消耗托管额度。
    runs-on: [self-hosted, pisper-linux]
    timeout-minutes: 360
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      # 不继承个人 Git URL rewrite；checkout 和推送都使用注入的 GitHub Token。
      GIT_CONFIG_GLOBAL: ${{ github.workspace }}/../pisper-release-gitconfig-${{ github.run_id }}
      GIT_CONFIG_NOSYSTEM: '1'
    outputs:
      source: ${{ steps.plan.outputs.source }}
      components: ${{ steps.plan.outputs.components }}
      app_version: ${{ steps.plan.outputs.app_version }}
    steps:
      - name: Require Linux x64
        shell: bash
        run: |
          if [[ "$RUNNER_OS" != "Linux" || "$RUNNER_ARCH" != "X64" ]]; then
            echo "This workflow requires Linux x64, got $RUNNER_OS $RUNNER_ARCH." >&2
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: release
          fetch-depth: 0
      - name: Consume trigger tag
        shell: bash
        env:
          TRIGGER_TAG: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          # 先删触发标签：无论后面成败，都能再推同一个名字重试。
          git push origin ":refs/tags/$TRIGGER_TAG"
          git tag -d "$TRIGGER_TAG" >/dev/null 2>&1 || true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Resolve release input and verify the source
        id: input
        shell: bash
        env:
          TRIGGER_TAG: ${{ github.ref_name }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          input="$(node scripts/release-trigger.mjs "$TRIGGER_TAG" --self-hosted)"
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$TRIGGER_SHA" ]; then
            echo "触发标签 $TRIGGER_TAG 指向 $TRIGGER_SHA，但 release 分支最新提交是 $head。" >&2
            echo "请对 release 分支最新提交推触发标签：git push origin release:refs/tags/$TRIGGER_TAG" >&2
            exit 1
          fi
          echo "value=$input" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Node dependencies
        run: npm ci
      - name: Configure release commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Plan release drafts
        id: plan
        shell: bash
        env:
          RELEASE_INPUT: ${{ steps.input.outputs.value }}
          # 只传“有没有”，不把令牌本身交给 plan。
          HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          set -Eeuo pipefail
          npm_flag=""
          if [ "$HAS_NPM_TOKEN" != "true" ]; then
            echo "::warning::没有配置 NPM_TOKEN Secret，这次不发布 npm。"
            npm_flag="--no-npm"
          fi
          # npm_flag 只会是空或 --no-npm，故意不加引号：为空时不传参数。
          npm run release:local -- plan "$RELEASE_INPUT" --github-output $npm_flag

  build-windows:
    name: Build Windows
    needs: plan
    if: needs.plan.outputs.components != ''
    uses: ./.github/workflows/release-self-hosted.yml
    with:
      stage: build
    secrets: inherit

  build-macos:
    name: Build macOS
    needs: plan
    if: needs.plan.outputs.components != ''
    uses: ./.github/workflows/release-mac-self-hosted.yml
    with:
      stage: build
    secrets: inherit

  build-linux:
    name: Build Linux
    needs: plan
    if: needs.plan.outputs.components != ''
    uses: ./.github/workflows/release-linux-self-hosted.yml
    with:
      stage: build
    secrets: inherit

  publish:
    name: Publish
    needs: [plan, build-windows, build-macos, build-linux]
    if: needs.plan.outputs.components != ''
    uses: ./.github/workflows/release-linux-self-hosted.yml
    with:
      stage: publish
    secrets: inherit

  # App 放在组件发布之后：两边都要往 release 推版本提交，错开就不会推送冲突。
  app:
    name: Release app
    needs: [plan, publish]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.app_version != '' &&
      (needs.plan.outputs.components == '' || needs.publish.result == 'success')
    uses: ./.github/workflows/release-app.yml
    with:
      version: ${{ needs.plan.outputs.app_version }}
      source_sha: ${{ needs.plan.outputs.source }}
    secrets: inherit
