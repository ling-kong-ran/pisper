name: Pull request quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-runtime:
    name: Web and Runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Security audit (non-blocking)
        run: npm audit --audit-level=high || true
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:mobile-shell
      - run: npm run test:chat-dock
      - run: npm run test:ui-ux
      - run: npm run test:thinking
      - run: npm run test:sidebar-projects

  windows-shell:
    name: Windows shell lifecycle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime-rs
      - name: Test the Rust host shell lifecycle on Windows
        run: cargo test --manifest-path runtime-rs/Cargo.toml --release host_shell

  ios-native:
    name: iOS native tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test DNS-SD permission handling
        run: bash scripts/test-ios-dns-sd.sh

  tui:
    name: Rust TUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tui
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true
      - name: Security audit (non-blocking)
        run: cargo audit || true
      - name: Check formatting
        run: cargo fmt --manifest-path src-tui/Cargo.toml -- --check
      - name: Check TUI
        run: cargo check --manifest-path src-tui/Cargo.toml
      - name: Test TUI
        run: cargo test --manifest-path src-tui/Cargo.toml

  runtime-rs-quality:
    name: Runtime Rust quality (fmt/clippy)
    runs-on: ubuntu-latest
    # AGENTS.md 要求 Rust 提交前运行 fmt 与 clippy，但 runtime-rs（本仓库最大的
    # Rust 代码库）此前没有 CI 强制，基线是否零告警尚未验证。先以非阻断方式
    # 建立可见性；确认基线干净后移除 continue-on-error，并给 clippy 加回
    # `-D warnings`。范围限定 -p pisper-server，不检查 vendored pi-rs 上游源码。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime-rs
      - name: Check formatting
        run: cargo fmt --manifest-path runtime-rs/Cargo.toml -p pisper-server -- --check
      - name: Clippy
        run: cargo clippy --locked --manifest-path runtime-rs/Cargo.toml -p pisper-server --all-targets
