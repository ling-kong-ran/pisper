name: Release from self-hosted Windows

# GitHub 托管额度用尽时，由仓库自托管的 Windows x64 Runner 复用本机发布脚本。
# 只发 Windows，其他平台停在上一版且不发 npm；移动 App 仍走独立的 CI 流程。
on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to run; use build or publish to resume an existing draft plan'
        required: true
        default: all
        type: choice
        options:
          - all
          - plan
          - build
          - status
          - publish
      version:
        description: 'Version increment for all/plan (patch, minor, major, or X.Y.Z)'
        required: true
        default: patch
        type: string
  # 推 self-release-* 标签时由 release-self-hosted-tag.yml 调用，只用 build。
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
      version:
        required: false
        default: patch
        type: string

permissions:
  contents: write

concurrency:
  group: release-self-hosted-${{ github.repository }}-${{ (inputs.stage == 'publish' || inputs.stage == 'all') && 'publish' || format('windows-{0}', inputs.stage) }}
  cancel-in-progress: false

jobs:
  release:
    name: Windows x64 release (${{ inputs.stage }})
    # 只选择明确登记了 pisper-windows 自定义标签的自托管 Runner，不消耗托管额度。
    runs-on: [self-hosted, pisper-windows]
    timeout-minutes: 360
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      # 不继承个人 Git URL rewrite；checkout 和 publish 都使用注入的 GitHub Token。
      GIT_CONFIG_GLOBAL: ${{ github.workspace }}/../pisper-release-gitconfig-${{ github.run_id }}
      GIT_CONFIG_NOSYSTEM: '1'
    steps:
      - name: Require Windows x64
        shell: powershell
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "This workflow requires Windows x64, got $env:RUNNER_OS $env:RUNNER_ARCH."
          }
      - name: Prefer Git Bash over the WSL launcher
        # 系统 PATH 里 System32 排在前面时，shell: bash 找到的是 WSL 的 bash.exe，
        # 没装发行版就直接失败（rust-toolchain 等步骤都用 bash）；把 Git for Windows 的 bin 放到最前。
        shell: powershell
        run: |
          # git.exe 通常在 <Git>\cmd 下，bash.exe 在 <Git>\bin 下。
          $candidates = @()
          $git = Get-Command git.exe -ErrorAction SilentlyContinue
          if ($git) { $candidates += Join-Path (Split-Path (Split-Path $git.Source)) 'bin' }
          $candidates += Join-Path $env:ProgramFiles 'Git\bin'
          $bin = $candidates | Where-Object { Test-Path (Join-Path $_ 'bash.exe') } | Select-Object -First 1
          if (-not $bin) { throw 'Git Bash (bash.exe) not found; install Git for Windows on this runner.' }
          Write-Output "Using Git Bash from $bin"
          Add-Content -Path $env:GITHUB_PATH -Value $bin -Encoding utf8
      - uses: actions/checkout@v5
        with:
          ref: release
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Node dependencies
        run: npm ci
      - name: Configure release commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Plan Windows-only release
        if: inputs.stage == 'all' || inputs.stage == 'plan'
        # 输入经环境变量传入并先校验，不直接拼进脚本，避免命令注入。
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: powershell
        run: |
          if ($env:RELEASE_VERSION -cnotmatch '^(patch|minor|major|\d+\.\d+\.\d+)$') {
            throw "version must be patch, minor, major or X.Y.Z, got: $env:RELEASE_VERSION"
          }
          npm run release:local -- plan $env:RELEASE_VERSION --platforms=windows
      - name: Build and upload Windows artifacts
        if: inputs.stage == 'all' || inputs.stage == 'build'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # 不加 --no-install：plan 可能刚把 Pi 依赖升级并提交，build 要按新的锁文件重新 npm ci，
        # 否则产物里打包的还是旧版本。
        run: npm run release:local -- build
      - name: Inspect draft release assets
        if: inputs.stage == 'all' || inputs.stage == 'build' || inputs.stage == 'status' || inputs.stage == 'publish'
        run: npm run release:local -- status
      - name: Publish validated draft releases
        if: inputs.stage == 'all' || inputs.stage == 'publish'
        run: npm run release:local -- publish
