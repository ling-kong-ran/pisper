# 正式发布使用 scripts/release-notes-format.mjs；此配置仅提供 GitHub 的备用分类。
changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: 新增功能
      labels:
        - feature
    - title: 优化改进
      labels:
        - enhancement
        - performance
        - refactor
        - style
        - ui
        - ux
    - title: 问题修复
      labels:
        - bug
        - fix
    - title: 其他变更
      labels:
        - '*'
