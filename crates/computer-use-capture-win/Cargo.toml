[package]
name = "computer-use-capture-win"
version = "0.1.0"
edition = "2021"
description = "Pisper Computer Use Windows 捕获后端：WGC 镜像流（运行时激活，零 WGC 强链接）+ GDI PrintWindow 轮询兜底"
license = "MIT"
publish = false

# 独立小 crate 的原因：主 crate（tauri 系）在 macOS 主机上无法对 Windows 目标做
# cargo check（ring 需要 C 交叉工具链），拆出后本 crate 可在任意主机上
# `cargo check --target x86_64-pc-windows-msvc` 完整验证。

[dependencies]

[target.'cfg(windows)'.dependencies]
# windows 0.62 与主 crate Cargo.lock 中 tauri 传递依赖版本对齐，避免引入第三个副本。
# WGC 为 WinRT：全部经 RoGetActivationFactory 运行时解析，无导入库强链接，
# 旧系统（<Win10 1803）上激活失败由调用方优雅降级到 GDI 轮询——
# 与 macOS 侧 dlopen ScreenCaptureKit 的零强链接约束完全对齐。
windows = { version = "0.62", features = [
  "Foundation",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_WindowsAndMessaging",
] }
