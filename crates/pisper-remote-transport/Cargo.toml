[package]
name = "pisper-remote-transport"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
test-support = []

[dependencies]
iroh = { version = "=1.1.0", default-features = false, features = ["tls-ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream", "json"] }
sha2 = "0.10"

[dev-dependencies]
rcgen = "0.13"
tokio-rustls = "0.26"
bytes = "1"
futures-util = "0.3"
rand = "0.8"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

rqrr = "=0.10.1"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
