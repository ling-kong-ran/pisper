<!doctype html><html><head><meta charset="utf-8"><title>Owned Browser Fixture</title><style>
body{margin:0;font:16px Arial;background:#f8f8f8;min-height:2200px}#swatch{height:64px;width:64px;background:rgb(18,104,173)}main{padding:16px}button,input,textarea,select,[contenteditable]{margin:8px;padding:8px}iframe{display:block;width:450px;height:180px}.hidden{display:none}.invisible{visibility:hidden}
</style></head><body><div id="swatch"></div><main>
<h1>Owned browser contract</h1><button id="trust">Trusted click</button><button class="duplicate">First duplicate</button><button class="duplicate">Second duplicate</button>
<form id="form" action="/submitted" method="get"><input id="value" name="query" placeholder="Fill and press Enter"><button id="submit">Submit owned form</button></form>
<input name="named field" placeholder="Named input"><button data-testid="hint">Test id hint</button><button aria-label="ARIA hint"></button><button id="9.odd name">Escaped id</button><button class="hidden">Hidden</button><button class="invisible">Invisible</button><button disabled>Disabled</button><textarea aria-label="Notes"></textarea><select name="choice"><option>A</option><option>B</option></select><div contenteditable="true" role="textbox" aria-label="Editable">Editable body</div><a id="link" href="/next">Owned next page</a>
<div id="click-count">clicks:0</div><div id="events"></div><div id="first">first:none</div><div id="storage"></div><iframe id="same-frame" src="/frame"></iframe><iframe id="cross-frame"></iframe>
<script>window.browserEvents=[];window.clicks=0;const publish=e=>{const value={type:e.type,trusted:e.isTrusted,value:e.target.value||'',key:e.key||'',target:e.target.id||e.target.tagName};window.browserEvents.push(value);document.querySelector('#events').textContent=JSON.stringify(window.browserEvents);fetch('/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(value)}).catch(()=>{})};document.querySelector('#trust').addEventListener('click',e=>{publish(e);document.querySelector('#click-count').textContent='clicks:'+(++window.clicks)});document.querySelectorAll('.duplicate').forEach((button,index)=>button.addEventListener('click',()=>document.querySelector('#first').textContent='first:'+index));for(const type of['input','change','keydown','keyup','submit'])document.addEventListener(type,publish);document.querySelector('#storage').textContent=localStorage.getItem('owned-session')||'storage:empty';</script>
</main></body></html>
