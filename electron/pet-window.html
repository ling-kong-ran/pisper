<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pisper Pet</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 192px; height: 288px; margin: 0; overflow: hidden; background: transparent; user-select: none; }
      body { font-family: system-ui, sans-serif; }
      #stage { position: fixed; inset: 0; cursor: grab; touch-action: none; }
      #stage.dragging { cursor: grabbing; }
      #bubble { position: absolute; z-index: 2; left: 50%; bottom: 210px; max-width: 180px; transform: translateX(-50%) translateY(4px); border: 1px solid rgba(17, 24, 39, .1); border-radius: 10px; background: rgba(255,255,255,.94); box-shadow: 0 8px 24px rgba(15,23,42,.2); color: #111827; font-size: 11px; line-height: 1.4; opacity: 0; padding: 6px 10px; pointer-events: none; text-align: center; transition: opacity .18s ease, transform .18s ease; white-space: pre-wrap; }
      #bubble.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
      #frame { --pet-scale: 1; position: absolute; left: 0; bottom: 0; width: 192px; height: 208px; contain: layout paint; overflow: hidden; }
      #sprite { --sprite-row: 0; --sprite-frames: 6; --sprite-duration: 1100ms; --sprite-y: calc(var(--sprite-row) * -208px); --sprite-end-x: calc(var(--sprite-frames) * -192px); width: 192px; height: 208px; background-image: var(--sprite-url); background-repeat: no-repeat; background-size: var(--sheet-width, 1536px) var(--sheet-height, 1872px); image-rendering: pixelated; transform: translateZ(0); transform-origin: top left; will-change: background-position; animation: pet-state var(--sprite-duration) steps(var(--sprite-frames)) infinite; }
      @keyframes pet-state { from { background-position: 0 var(--sprite-y); } to { background-position: var(--sprite-end-x) var(--sprite-y); } }
      @media (prefers-reduced-motion: reduce) { #sprite { animation: none; } #bubble { transition: none; } }
    </style>
  </head>
  <body>
    <main id="stage" aria-label="Pisper desktop pet">
      <div id="bubble" role="status" aria-live="polite"></div>
      <div id="frame" role="img" aria-label="Petdex desktop pet">
        <div id="sprite"></div>
      </div>
    </main>
    <script src="./pet-window.js"></script>
  </body>
</html>
