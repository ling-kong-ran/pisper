<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="moonblue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fb0ff"/>
      <stop offset="1" stop-color="#4c6ef5"/>
    </linearGradient>
    <radialGradient id="night" cx="0.5" cy="0.4" r="0.9">
      <stop offset="0" stop-color="#16204a"/>
      <stop offset="1" stop-color="#0a0f26"/>
    </radialGradient>
    <filter id="glow4" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <mask id="crescent">
      <circle cx="292" cy="238" r="96" fill="#ffffff"/>
      <circle cx="328" cy="208" r="84" fill="#000000"/>
    </mask>
  </defs>

  <rect width="512" height="512" rx="112" fill="#05070f"/>

  <!-- badge -->
  <circle cx="256" cy="256" r="210" fill="url(#night)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- tiny stars inside badge -->
  <g fill="#ffffff">
    <circle cx="176" cy="150" r="2" opacity="0.5"/>
    <circle cx="352" cy="330" r="1.8" opacity="0.4"/>
    <circle cx="200" cy="372" r="1.6" opacity="0.35"/>
    <circle cx="368" cy="140" r="1.5" opacity="0.3"/>
  </g>

  <!-- p : stem -->
  <rect x="158" y="142" width="60" height="258" rx="30" fill="url(#moonblue)"/>
  <!-- p : crescent bowl -->
  <circle cx="292" cy="238" r="96" fill="url(#moonblue)" mask="url(#crescent)"/>

  <!-- amber evening star in the opening -->
  <g transform="translate(322 206)" filter="url(#glow4)">
    <path d="M0,-30 C2.8,-8.5 8.5,-2.8 30,0 C8.5,2.8 2.8,8.5 0,30 C-2.8,8.5 -8.5,2.8 -30,0 C-8.5,-2.8 -2.8,-8.5 0,-30 Z" fill="#ffc94d"/>
  </g>
</svg>
