<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="bg1" cx="0.5" cy="0.35" r="0.95">
      <stop offset="0" stop-color="#161c3a"/>
      <stop offset="1" stop-color="#0b0e1a"/>
    </radialGradient>
    <filter id="glow1" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg1)"/>

  <!-- lowercase p : stem -->
  <rect x="148" y="140" width="72" height="282" rx="34" fill="url(#pgrad)"/>
  <!-- lowercase p : bowl -->
  <circle cx="272" cy="228" r="66" fill="none" stroke="url(#pgrad)" stroke-width="46"/>

  <!-- evening star in the counter -->
  <g transform="translate(272 228)" filter="url(#glow1)">
    <path d="M0,-36 C3.2,-10 10,-3.2 36,0 C10,3.2 3.2,10 0,36 C-3.2,10 -10,3.2 -36,0 C-10,-3.2 -3.2,-10 0,-36 Z" fill="#ffd166"/>
  </g>
</svg>
