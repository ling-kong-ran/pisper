<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="aurora" gradientUnits="userSpaceOnUse" x1="140" y1="150" x2="380" y2="450">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="bg3" cx="0.5" cy="0.38" r="0.95">
      <stop offset="0" stop-color="#0e1430"/>
      <stop offset="1" stop-color="#070a18"/>
    </radialGradient>
    <filter id="glow3" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg3)"/>

  <!-- faint starfield -->
  <g fill="#ffffff">
    <circle cx="66" cy="92" r="2" opacity="0.5"/>
    <circle cx="126" cy="60" r="1.6" opacity="0.4"/>
    <circle cx="204" cy="72" r="2.2" opacity="0.6"/>
    <circle cx="302" cy="58" r="1.5" opacity="0.35"/>
    <circle cx="382" cy="82" r="2" opacity="0.5"/>
    <circle cx="442" cy="62" r="1.4" opacity="0.4"/>
    <circle cx="450" cy="152" r="2.4" opacity="0.6"/>
    <circle cx="70" cy="204" r="1.6" opacity="0.35"/>
    <circle cx="60" cy="302" r="2" opacity="0.5"/>
    <circle cx="92" cy="424" r="1.8" opacity="0.45"/>
    <circle cx="430" cy="252" r="1.5" opacity="0.3"/>
    <circle cx="442" cy="332" r="2.2" opacity="0.55"/>
    <circle cx="382" cy="442" r="1.6" opacity="0.4"/>
    <circle cx="160" cy="452" r="1.4" opacity="0.35"/>
  </g>

  <!-- P built from a terminal chevron : stem + > bowl -->
  <g stroke="url(#aurora)" stroke-width="46" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M172,168 V408"/>
    <path d="M172,168 L322,242 L172,316"/>
  </g>

  <!-- blinking cursor -->
  <rect x="248" y="412" width="112" height="30" rx="15" fill="url(#aurora)" filter="url(#glow3)"/>
</svg>
