<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="description" content="Pisper — Pi 驱动，Agent 低语。多 Agent 桌面应用，让多个 AI Agent 沿各自轨道并行工作。" />
    <title>Pisper</title>
    <script>
      try {
        // React 挂载前应用持久化偏好，避免主题和客制化选项出现首帧闪烁。
        let stored = {}
        let version = 0
        try {
          const raw = JSON.parse(localStorage.getItem('pisper-ui') || '{}')
          stored = (raw && raw.state) || {}
          version = Number(raw && raw.version) || 0
        } catch {}
        let theme = stored.theme
        if (version === 0 && theme === 'system') theme = 'scheduled'
        if (!['system', 'scheduled', 'light', 'dark'].includes(theme)) {
          const legacy = localStorage.getItem('pisper-theme')
          theme = ['system', 'light', 'dark'].includes(legacy) ? legacy : 'system'
          if (theme === 'system' && legacy) theme = 'scheduled'
        }
        let dark = theme === 'dark'
        if (theme === 'system') dark = window.matchMedia('(prefers-color-scheme: dark)').matches
        if (theme === 'scheduled') {
          const hour = new Date().getHours()
          dark = hour >= 18 || hour < 8
        }
        const root = document.documentElement
        root.dataset.theme = dark ? 'dark' : 'light'
        root.classList.toggle('dark', dark)
        // 与 ui-store 的 v3 迁移保持一致：默认强调色为 blue，v3 之前的中性档视为旧默认值。
        let accent = ['neutral', 'blue', 'teal', 'violet', 'coral'].includes(stored.accent)
          ? stored.accent
          : 'blue'
        if (accent === 'neutral' && version < 3) accent = 'blue'
        root.dataset.accent = accent
        root.dataset.density = stored.density === 'compact' ? 'compact' : 'comfortable'
        root.dataset.fontScale = ['small', 'default', 'large'].includes(stored.fontScale)
          ? stored.fontScale
          : 'default'
        root.dataset.radius = ['sharp', 'default', 'soft'].includes(stored.radius)
          ? stored.radius
          : 'default'
        root.dataset.motion = ['system', 'full', 'reduced'].includes(stored.motion)
          ? stored.motion
          : 'system'
        const storedLanguage = localStorage.getItem('pisper-language')
        document.documentElement.lang = storedLanguage === 'en-US' ? 'en-US' : 'zh-CN'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
